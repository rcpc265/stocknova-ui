<div class="h-screen w-screen bg-gray-50 flex overflow-hidden font-sans">
  <!-- Área Izquierda: Catálogo -->
  <main class="flex-1 flex flex-col min-w-0">
    <header
      class="h-16 bg-white border-b border-gray-200 shadow-sm flex items-center px-6 shrink-0"
    >
      <h1 class="text-xl font-bold text-gray-800 tracking-tight">StockNova POS</h1>
      <!-- Aquí irá la barra de búsqueda en el futuro -->
    </header>

    <div class="flex-1 overflow-y-auto p-6">
      <!-- Aquí irá la ProductGrid (Fase 2) -->
      <div
        class="border-2 border-dashed border-gray-300 rounded-xl h-full flex items-center justify-center bg-gray-100/50"
      >
        <p class="text-gray-500 font-medium">Catálogo de Productos (Próximamente)</p>
      </div>
    </div>
  </main>

  <!-- Área Derecha: Sidebar del Carrito -->
  <aside
    class="w-[400px] bg-white border-l border-gray-200 shadow-[[-4px_0_15px_-3px_rgba(0,0,0,0.05)]] flex flex-col shrink-0 z-10"
  >
    <header
      class="h-16 border-b border-gray-200 flex items-center justify-between px-6 shrink-0 bg-gray-50/80 backdrop-blur-sm"
    >
      <h2 class="text-lg font-semibold text-gray-800">Orden Actual</h2>
      <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full">Nva</span>
    </header>

    <div class="flex-1 overflow-y-auto p-4">
      <!-- Aquí irán los CartItems (Fase 3) -->
      <div
        class="h-full border-2 border-dashed border-gray-200 rounded-xl flex items-center justify-center"
      >
        <p class="text-gray-400 text-sm">El carrito está vacío</p>
      </div>
    </div>

    <footer class="p-6 border-t border-gray-200 bg-gray-50 shrink-0">
      <!-- Aquí irán los totales y el botón de pago (Fase 3) -->
      <div class="space-y-3 mb-6">
        <div class="flex justify-between text-sm text-gray-600">
          <span>Subtotal</span>
          <span class="font-medium">S/ 0.00</span>
        </div>
        <div class="flex justify-between text-sm text-gray-600">
          <span>IGV (18%)</span>
          <span class="font-medium">S/ 0.00</span>
        </div>
        <div
          class="flex justify-between text-lg font-bold text-gray-900 pt-3 border-t border-gray-200"
        >
          <span>Total</span>
          <span>S/ 0.00</span>
        </div>
      </div>
      <button
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors duration-200 shadow-md shadow-blue-600/20 disabled:opacity-50 disabled:cursor-not-allowed"
        disabled
      >
        Cobrar Orden
      </button>
    </footer>
  </aside>
</div>
